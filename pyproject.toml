[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vistral"
version = "0.0.0"
description = "Validated, inspectable computer-vision pipelines composing OpenCV, Hugging Face and Supervision."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mohammed Zaitoun" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Ranges per docs/DECISIONS.md (D-003, D-004, D-007, D-016). Not installed during planning.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<6",
    "supervision>=0.31,<0.32",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
hf = ["torch", "torchvision", "transformers>=5,<6", "huggingface_hub"]
video = ["torchcodec"]
track = ["trackers"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "hypothesis",
    "ruff",
    "pyright",
    "import-linter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vistral"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF022"]  # __all__ is grouped by meaning, not sorted

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: real (large) model checkpoints",
    "gpu: requires a CUDA device",
]

[tool.coverage.run]
source = ["vistral"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.importlinter]
root_package = "vistral"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core stays light (D-011)"
type = "forbidden"
source_modules = ["vistral.core"]
forbidden_modules = ["cv2", "torch", "transformers", "supervision", "PIL", "pydantic"]
allow_indirect_imports = true
# Function-level (lazy) imports, only executed when the feature is used; runtime import
# weight is enforced by tests/unit/test_layering.py.
ignore_imports = [
    "vistral.core.convert -> torch",
    "vistral.core.results -> cv2",
    "vistral.core.results -> supervision",
    "vistral.core.image -> PIL",
]

[[tool.importlinter.contracts]]
name = "core does not depend on higher layers"
type = "forbidden"
source_modules = ["vistral.core"]
forbidden_modules = ["vistral.testing"]
